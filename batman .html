<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>
<style>
:root{
  --gold:#FFD700;
  --silver:#C0C0C0;
  --dark:#1a1a1a;
  --white:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:linear-gradient(135deg,var(--dark) 0%,#2c2c2c 100%);color:var(--white);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(90deg,var(--gold),var(--silver));padding:30px;text-align:center;box-shadow:0 4px 15px rgba(255,215,0,0.3);}
header h1{color:var(--dark);font-size:2.5rem;font-weight:800;letter-spacing:2px;}
.container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:rgba(255,255,255,0.05);border:2px solid var(--gold);border-radius:15px;padding:40px;max-width:600px;width:100%;text-align:center;backdrop-filter:blur(10px);}
.card h2{color:var(--gold);margin-bottom:20px;font-size:2rem;}
.card p{color:var(--silver);margin-bottom:30px;font-size:1.1rem;line-height:1.6;}
.social-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.social-links a{display:flex;align-items:center;gap:10px;padding:15px 25px;border-radius:50px;text-decoration:none;font-weight:600;transition:all 0.3s ease;font-size:1rem;}
.social-links a.youtube{background:#FF0000;color:white;}
.social-links a.snapchat{background:#FFFC00;color:#000;}
.social-links a.facebook{background:#1877F2;color:white;}
.social-links a:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(255,215,0,0.4);}
.social-links svg{width:24px;height:24px;}
footer{background:var(--dark);text-align:center;padding:20px;color:var(--silver);border-top:2px solid var(--gold);}
@media(max-width:600px){
  header h1{font-size:1.8rem;}
  .card{padding:25px;}
  .social-links{flex-direction:column;}
}
</style>
</head>
<body>
<header>
  <h1>My Website</h1>
</header>

<div class="container">
  <div class="card">
    <h2>Connect With Us</h2>
    <p>Follow us on social media for updates, content, and more</p>
    <div class="social-links">
      <a href="https://youtube.com" target="_blank" class="youtube">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTube
      </a>
      <a href="https://snapchat.com" target="_blank" class="snapchat">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.174-.105-.949-.199-2.403.041-3.439.219-.937 1.406-5.957 1.406-5.957s-.359-.72-.359-1.781c0-1.663.967-2.911 2.168-2.911 1.024 0 1.518.769 1.518 1.688 0 1.029-.653 2.567-.992 3.992-.285 1.193.6 2.165 1.775 2.165 2.128 0 3.768-2.245 3.768-5.487 0-2.861-2.063-4.869-5.008-4.869-3.41 0-5.409 2.562-5.409 5.199 0 1.033.394 2.143.889 2.739.099.12.112.225.083.348-.09.375-.293 1.199-.334 1.363-.053.225-.172.271-.401.165-1.495-.69-2.433-2.878-2.433-4.646 0-3.776 2.748-7.252 7.92-7.252 4.158 0 7.392 2.967 7.392 6.923 0 4.135-2.607 7.462-6.233 7.462-1.214 0-2.354-.629-2.758-1.379l-.749 2.848c-.269 1.045-1.004 2.352-1.498 3.146C9.667 21.978 10.757 22 11.995 22c6.624 0 11.99-5.373 11.99-12C23.988 5.373 18.624.028 12.017.028z"/></svg>
        Snapchat
      </a>
      <a href="https://facebook.com" target="_blank" class="facebook">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35C.595 0 0 .592 0 1.326v21.348C0 23.408.595 24 1.325 24h11.495v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.797.715-1.797 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116C23.406 24 24 23.408 24 22.674V1.326C24 .592 23.406 0 22.675 0"/></svg>
        Facebook
      </a>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 My Website. All Rights Reserved.</p>
</footer>
</body>
</html>
